AWSTemplateFormatVersion: "2010-09-09"
Description: Per-user Ogham quick captures stored independently from the user-state snapshot.

Resources:
  OghamCapturesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: OghamCaptures
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: captureId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
        - AttributeName: captureId
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

Outputs:
  CaptureTableName:
    Value: !Ref OghamCapturesTable
  CaptureTableArn:
    Value: !GetAtt OghamCapturesTable.Arn
